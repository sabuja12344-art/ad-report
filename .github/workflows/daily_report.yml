name: 광고 보고서 자동 수집

on:
  schedule:
    # 매일 오전 8시 (KST) = UTC 23:00 (전날)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Secrets 검증
        env:
          _META:    ${{ secrets.META_ACCESS_TOKEN }}
          _NAVER_K: ${{ secrets.NAVER_API_KEY }}
          _NAVER_S: ${{ secrets.NAVER_SECRET_KEY }}
          _GOOGLE:  ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          _DOWN_K:  ${{ secrets.DOWNTOWNER_NAVER_API_KEY }}
          _DOWN_S:  ${{ secrets.DOWNTOWNER_NAVER_SECRET_KEY }}
        run: |
          MISSING=""
          [ -z "$_META" ]    && MISSING="$MISSING META_ACCESS_TOKEN"
          [ -z "$_NAVER_K" ] && MISSING="$MISSING NAVER_API_KEY"
          [ -z "$_NAVER_S" ] && MISSING="$MISSING NAVER_SECRET_KEY"
          [ -z "$_GOOGLE" ]  && MISSING="$MISSING GOOGLE_CREDENTIALS_JSON"
          if [ -n "$MISSING" ]; then
            echo "누락된 Secrets:$MISSING"
            exit 1
          fi
          [ -z "$_DOWN_K" ] && echo "경고: DOWNTOWNER_NAVER_API_KEY 없음 — 다운타우너 네이버 데이터 스킵됨"
          echo "Secrets 확인 완료"

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 구글 서비스 계정 키 생성
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDENTIALS" > google_credentials.json

      - name: 광고 데이터 수집
        env:
          NAVER_API_KEY:              ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY:           ${{ secrets.NAVER_SECRET_KEY }}
          DOWNTOWNER_NAVER_API_KEY:    ${{ secrets.DOWNTOWNER_NAVER_API_KEY }}
          DOWNTOWNER_NAVER_SECRET_KEY: ${{ secrets.DOWNTOWNER_NAVER_SECRET_KEY }}
          EVERYDAYS_NAVER_API_KEY:     ${{ secrets.EVERYDAYS_NAVER_API_KEY }}
          EVERYDAYS_NAVER_SECRET_KEY:  ${{ secrets.EVERYDAYS_NAVER_SECRET_KEY }}
          META_ACCESS_TOKEN:   ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_JSON_PATH:    google_credentials.json
        run: python main.py

      - name: 실패 알림
        if: failure()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL:            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
          import smtplib, os
          from email.mime.text import MIMEText
          user = os.environ["GMAIL_USER"]
          pw   = os.environ["GMAIL_APP_PASSWORD"]
          url  = os.environ["RUN_URL"]
          msg  = MIMEText(f"[광고 자동화] 구글시트 수집 워크플로우가 실패했습니다.\n\n로그 확인: {url}")
          msg["Subject"] = "[광고 자동화] 구글시트 수집 실패"
          msg["From"] = user
          msg["To"]   = user
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pw)
              s.send_message(msg)
          PYEOF
