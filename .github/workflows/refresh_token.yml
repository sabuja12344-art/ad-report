name: 메타 토큰 자동 갱신

on:
  schedule:
    - cron: '0 0 */45 * *'  # 45일마다 갱신 (Meta 토큰 60일 만료 기준 안전 마진)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 토큰 갱신 및 시크릿 업데이트
        run: |
          # Meta Graph API 최신 버전으로 갱신 (meta_api.py와 동일한 버전 사용)
          RESPONSE=$(curl -s \
            "https://graph.facebook.com/v22.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${{ secrets.META_APP_ID }}&client_secret=${{ secrets.META_APP_SECRET }}&fb_exchange_token=${{ secrets.META_ACCESS_TOKEN }}")

          echo "API 응답: $RESPONSE"

          NEW_TOKEN=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              if 'error' in d:
                  print(f'ERROR: {d[\"error\"].get(\"message\", \"unknown\")}', file=sys.stderr)
                  print('ERROR')
              else:
                  print(d.get('access_token', 'ERROR'))
          except Exception as e:
              print(f'PARSE_ERROR: {e}', file=sys.stderr)
              print('ERROR')
          ")

          if [[ "$NEW_TOKEN" == ERROR* ]]; then
            echo "토큰 갱신 실패: $NEW_TOKEN"
            exit 1
          fi

          echo "새 토큰 획득 완료, 유효성 검증 중..."

          # 갱신된 토큰으로 실제 API 호출해서 유효성 확인
          VERIFY=$(curl -s "https://graph.facebook.com/v22.0/me?access_token=$NEW_TOKEN")
          if echo "$VERIFY" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if 'id' in d else 1)"; then
            echo "토큰 유효성 확인 완료"
          else
            echo "토큰 유효성 검증 실패: $VERIFY"
            exit 1
          fi

          gh secret set META_ACCESS_TOKEN --body "$NEW_TOKEN" --repo ${{ github.repository }}
          echo "GitHub Secret 업데이트 완료"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: 실패 알림
        if: failure()
        continue-on-error: true
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL:            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
          import smtplib, os
          from email.mime.text import MIMEText
          user = os.environ["GMAIL_USER"]
          pw   = os.environ["GMAIL_APP_PASSWORD"]
          url  = os.environ["RUN_URL"]
          msg  = MIMEText(
              f"[광고 자동화] 메타 토큰 자동 갱신이 실패했습니다.\n"
              f"수동으로 Meta 토큰을 갱신하고 GitHub Secret(META_ACCESS_TOKEN)을 업데이트해야 합니다.\n\n"
              f"로그 확인: {url}"
          )
          msg["Subject"] = "[광고 자동화] 메타 토큰 갱신 실패 — 즉시 확인 필요"
          msg["From"] = user
          msg["To"]   = user
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pw)
              s.send_message(msg)
          PYEOF
