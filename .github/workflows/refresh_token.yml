name: 메타 토큰 자동 갱신

on:
  schedule:
    - cron: '0 0 1 */2 *'  # 2개월마다 1일 자동 갱신 (45일 이내 주기)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 토큰 갱신 및 시크릿 업데이트
        run: |
          NEW_TOKEN=$(curl -s \
            "https://graph.facebook.com/v19.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${{ secrets.META_APP_ID }}&client_secret=${{ secrets.META_APP_SECRET }}&fb_exchange_token=${{ secrets.META_ACCESS_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','ERROR'))")

          if [ "$NEW_TOKEN" = "ERROR" ]; then
            echo "토큰 갱신 실패"
            exit 1
          fi

          echo "토큰 갱신 성공"
          gh secret set META_ACCESS_TOKEN --body "$NEW_TOKEN" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
